name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PORTUGAL_VS_ANJRTINA_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android project
        run: |
          unzip -q PORTUGAL_VS_ANJRTINA_Android_Project.zip -d work
          echo "PROJECT_DIR=$PWD/work" >> $GITHUB_ENV
      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PORTUGAL-VS-ANJRTINA-debug-APK
          path: work/app/build/outputs/apk/debug/app-debug.apk
